[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf2dicom-toolkit"
version = "0.1.0"
description = "A small open-source toolkit for converting PDF reports into DICOM Encapsulated PDF objects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "PDF2DICOM Toolkit Contributors" }
]
keywords = ["dicom", "pdf", "pacs", "healthcare", "radiology", "pydicom"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "pydicom>=2.4",
  "pynetdicom>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
pdf2dicom = "pdf2dicom_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2dicom_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"
